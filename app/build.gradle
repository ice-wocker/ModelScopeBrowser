plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mscope.browser'
    compileSdk 36
    buildToolsVersion = "36.0.0"
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.mscope.browser"
        minSdk 24
        targetSdk 36
        versionCode 5
        versionName "2.0"

        ndk {
            // 只打包真机常见 ABI，控制 APK 体积与编译时间
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                // 本地已有 llama.cpp 源码时可用 -PllamaCppDir=/path 加速；
                // 否则 CMake 会按固定 tag 通过 FetchContent 拉取
                arguments "-DLLAMA_CPP_DIR=" + (project.findProperty("llamaCppDir") ?: "")
                cppFlags "-O3"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    def keystoreProps = rootProject.file("keystore.properties")
    signingConfigs {
        release {
            if (keystoreProps.exists()) {
                def p = new Properties()
                keystoreProps.withInputStream { p.load(it) }
                storeFile rootProject.file(p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig keystoreProps.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'io.noties.markwon:core:4.6.2'
}