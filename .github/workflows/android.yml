name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # 版本由仓库内的 Gradle Wrapper（gradle/wrapper）决定；该 action 同时负责依赖缓存

      # ubuntu-latest 已预装 Android SDK；这里只补齐项目需要的 platform/build-tools/ndk/cmake。
      # 注意：不要用 android-actions/setup-android，它会执行 `sdkmanager tools`，
      # 而新版 cmdline-tools 已移除该 package，会导致步骤失败。
      - name: Ensure Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK: $SDK"
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            # NDK 27.2.12479018 与 CMake 3.22.1 是 llama.cpp 原生编译所需；
            # 显式安装一次，避免依赖 AGP 的自动下载（CI 上偶发失败）。
            "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" \
                       "ndk;27.2.12479018" "cmake;3.22.1" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      # 注意：secrets 不能直接用于步骤级 if 条件（会导致工作流校验失败），
      # 因此这里注入成 env，再在脚本里判断。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ../release.keystore
            {
              echo "storeFile=../release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            echo "已配置正式签名"
          else
            # 打 Tag 发布的包会直接给用户下载，必须是正式签名。
            # 曾经因为这里静默回退成 debug 签名，导致 v1.2 的 Release 包无法覆盖安装。
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::发布 Release 前必须配置签名 Secrets，否则会产出 debug 签名的包，用户无法覆盖安装。请在 Settings → Secrets and variables → Actions 中配置 KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD。"
              exit 1
            fi
            echo "::warning::未配置签名 Secrets，本次 release 为 debug 签名（仅作 CI 产物，请勿用于发布）"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # 仅在推送 v* 标签时自动发布 Release
      - name: Rename release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp app/build/outputs/apk/release/app-release.apk "ModelScope-Models-${GITHUB_REF_NAME#v}.apk"

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ModelScope-Models-*.apk
          generate_release_notes: true
          draft: false